<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Crocharmi</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <!-- Logo -->
        <a href="../index.html" class="auth-logo">
            CROCHARMI
        </a>

        <!-- Sign In Card -->
        <section class="auth-card">

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>
                    Sign in to continue to your Crocharmi account.
                </p>
            </div>

            <form id="signin-form">

                <!-- Email -->
                <div class="form-group">
                    <label for="signin-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signin-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="signin-password">
                        Password
                    </label>

                    <div class="password-field">
                        <input
                            type="password"
                            id="signin-password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signin-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <!-- Message -->
                <div
                    id="signin-message"
                    class="auth-message"
                    aria-live="polite"
                ></div>

                <!-- Submit -->
                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Sign In
                </button>

            </form>

            <!-- Sign Up Link -->
            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a href="signup.html">Create an Account</a>
                </p>
            </div>

        </section>

        <!-- Back to Home -->
        <a href="../index.html" class="back-home">
            ← Back to Home
        </a>

    </main>

    <!-- JavaScript -->
    <script src="../js/shared/toast.js"></script>
    <script src="../js/shared/modal.js"></script>
    <script src="../js/shared/validation.js"></script>
    <script src="../js/auth.js"></script>

</body>
</html>
